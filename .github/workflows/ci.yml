name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: brew install shellcheck
      - run: bun run check:shell
      - run: bun run test
      - run: npm ci --prefix packages/better-computer-use --ignore-scripts
      - run: npm run test:bcu
