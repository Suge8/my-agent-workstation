"$schema" = "https://starship.rs/config-schema.json"

# -----------------------------------------------------------------------------
# Starship 提示符配置
#
# 这份配置当前走的是「Powerline 分段彩色块」风格。
# 从左到右大致会显示：
#   1. 左侧起始圆角
#   2. 操作系统 / 用户名
#   3. 当前目录
#   4. Git 分支 / Git 状态
#   5. 各种语言运行时版本
#   6. Docker 上下文
#   7. 时间
#
# 如果你只想小改，最常动的地方通常是：
#   - format：整体显示顺序
#   - [directory]：目录显示方式
#   - [git_branch] / [git_status]：Git 信息
#   - [time]：时间显示
#   - [username] / [os]：最前面的用户或系统图标
# -----------------------------------------------------------------------------

# -----------------------------------------------------------------------------
# 整体布局
#
# 这里定义整条 prompt 的显示顺序。
# 你看到的每一段 `$xxx` 都是一个 Starship 模块。
#
# 颜色说明：
#   - #9A348E：第一段，用户区域
#   - #DA627D：第二段，目录区域
#   - #FCA17D：第三段，Git 区域
#   - #86BBD8：第四段，语言运行时区域
#   - #06969A：第五段，Docker 区域
#   - #33658A：第六段，时间区域
#
# 如果你想去掉某一块，直接删掉对应的 `$模块名` 即可。
# 例如想去掉时间，就删掉：
#   $time
# 以及它前面的那段分隔符。
# -----------------------------------------------------------------------------
format = """
[](#9A348E)\
$os\
$username\
[](bg:#DA627D fg:#9A348E)\
$directory\
[](fg:#DA627D bg:#FCA17D)\
$git_branch\
$git_status\
[](fg:#FCA17D bg:#86BBD8)\
$c\
$elixir\
$elm\
$golang\
$gradle\
$haskell\
$java\
$julia\
$nodejs\
$nim\
$rust\
$scala\
[](fg:#86BBD8 bg:#06969A)\
$docker_context\
[](fg:#06969A bg:#33658A)\
[ ♥ ](bg:#33658A)\
[ ](fg:#33658A)\
"""

# 是否在 prompt 顶部额外留一行空白。
# 你当前没有启用；保持紧凑更适合现在这套风格。
# add_newline = false

# -----------------------------------------------------------------------------
# 用户名模块
#
# 这块控制最前面的用户名显示。
# 当前设置为始终显示用户名。
#
# 常见改法：
#   1. 不想显示用户名：
#      disabled = true
#   2. 想显示系统图标而不是用户名：
#      把 disabled 改成 true，并启用下面的 [os]
# -----------------------------------------------------------------------------
[username]
show_always = true
style_user = "bg:#9A348E"
style_root = "bg:#9A348E"
format = "[$user ]($style)"
disabled = false

# -----------------------------------------------------------------------------
# 操作系统模块
#
# 这块可以在最左边显示 macOS / Linux / Windows 的图标。
# 你当前把它关掉了，所以最前面只显示用户名。
#
# 如果你想在用户名前面显示苹果图标，可以改成：
#   disabled = false
#
# 然后在 format 里保留 `$os$username` 这个顺序即可。
# -----------------------------------------------------------------------------
[os]
style = "bg:#9A348E"
disabled = false
format = "[$symbol ]($style)"

[os.symbols]
Macos = ""

# -----------------------------------------------------------------------------
# 目录模块
#
# 控制当前路径怎么显示。
#
# 关键参数：
#   - truncation_length：最多保留几级目录
#   - truncation_symbol：前面被折叠时显示什么
#   - format：目录块的渲染方式
#
# 你当前设置为最多保留 3 级路径。
# -----------------------------------------------------------------------------
[directory]
style = "bg:#DA627D"
format = "[ $path ]($style)"
truncation_length = 0
truncate_to_repo = false
truncation_symbol = ""

# -----------------------------------------------------------------------------
# 目录文本替换
#
# 用图标替换常见英文目录名，让路径更短、更直观。
# 例如：
#   Documents -> 󰈙
#   Downloads -> 
#
# 顺序有影响，越靠前越优先匹配。
# -----------------------------------------------------------------------------
[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

# -----------------------------------------------------------------------------
# C / C++ 模块
#
# 只会在相关项目中出现。
# 如果你不想显示某个语言版本，直接把对应模块从 format 删除即可。
# -----------------------------------------------------------------------------
[c]
symbol = " "
style = "bg:#86BBD8"
format = "[ $symbol ($version) ]($style)"

[cpp]
symbol = " "
style = "bg:#86BBD8"
format = "[ $symbol ($version) ]($style)"

# -----------------------------------------------------------------------------
# Docker 模块
#
# 当目录上下文里存在 Docker 相关信息时显示。
# -----------------------------------------------------------------------------
[docker_context]
symbol = " "
style = "bg:#06969A"
format = "[ $symbol $context ]($style)"

# -----------------------------------------------------------------------------
# Elixir / Elm / Go / Gradle / Haskell / Java / Julia / Node / Nim / Rust /
# Scala 这些语言模块都是同一类逻辑：
#   - 在相关项目里显示
#   - 显示图标 + 当前版本
#   - 共用同一段背景色
# -----------------------------------------------------------------------------
[elixir]
symbol = " "
style = "bg:#86BBD8"
format = "[ $symbol ($version) ]($style)"

[elm]
symbol = " "
style = "bg:#86BBD8"
format = "[ $symbol ($version) ]($style)"

[golang]
symbol = " "
style = "bg:#86BBD8"
format = "[ $symbol ($version) ]($style)"

[gradle]
style = "bg:#86BBD8"
format = "[ $symbol ($version) ]($style)"

[haskell]
symbol = " "
style = "bg:#86BBD8"
format = "[ $symbol ($version) ]($style)"

[java]
symbol = " "
style = "bg:#86BBD8"
format = "[ $symbol ($version) ]($style)"

[julia]
symbol = " "
style = "bg:#86BBD8"
format = "[ $symbol ($version) ]($style)"

[nodejs]
symbol = ""
style = "bg:#86BBD8"
format = "[ $symbol ($version) ]($style)"

[nim]
symbol = "󰆥 "
style = "bg:#86BBD8"
format = "[ $symbol ($version) ]($style)"

[rust]
symbol = ""
style = "bg:#86BBD8"
format = "[ $symbol ($version) ]($style)"

[scala]
symbol = " "
style = "bg:#86BBD8"
format = "[ $symbol ($version) ]($style)"

# -----------------------------------------------------------------------------
# Git 分支模块
#
# 显示当前仓库分支名。
# -----------------------------------------------------------------------------
[git_branch]
symbol = ""
style = "bg:#FCA17D"
format = "[ $symbol $branch ]($style)"

# -----------------------------------------------------------------------------
# Git 状态模块
#
# 显示修改、未跟踪、领先/落后等信息。
# -----------------------------------------------------------------------------
[git_status]
style = "bg:#FCA17D"
format = "[$all_status$ahead_behind ]($style)"

# -----------------------------------------------------------------------------
# 时间模块
#
# 这一块保留注释说明，但当前主题已经不再使用时间模块：
#   1. format 里已经移除了 `$time`
#   2. 这里也不再定义 [time]
#
# 如果以后想重新加回来，可以重新创建：
#   [time]
#   disabled = false
#   time_format = "%R"
#   style = "bg:#33658A"
#   format = "[ $time ]($style)"
