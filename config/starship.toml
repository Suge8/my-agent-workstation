"$schema" = "https://starship.rs/config-schema.json"

# 只用标准 Unicode 字符和 ANSI 色名：UU 远程等没有 Nerd Font 的终端不出方框，
# 颜色取自终端调色板，随 Ghostty 的 Catppuccin 明暗切换。
format = "$username$hostname$directory$git_branch$git_state$git_status$cmd_duration$character"

# username 与 hostname 默认只在 SSH 或 root 下出现
[username]
style_user = "yellow"
format = "[$user]($style)@"

[hostname]
ssh_symbol = ""
style = "yellow"
format = "[$hostname]($style) "

[directory]
style = "blue"
read_only = " ro"

[git_branch]
symbol = ""
style = "purple"
format = "[$branch]($style) "

[git_status]
style = "red"

[cmd_duration]
style = "yellow"
format = "[$duration]($style) "
